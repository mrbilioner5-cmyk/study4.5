
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашнее задание DOM</title>

    <style>
        body {
            font-family: Arial;
            background-color: white;
        }

        #mouseBox {
            width: 500px;
            height: 500px;
            border: 2px solid black;
            box-sizing: border-box;
            background-color: white;
            color: black;
        }

        .container {
            background-color: white;
            color: black;
            padding: 15px;
            width: fit-content;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>1. Счётчик</h2>

        <button id="decrement">-</button>
        <span id="counter">0</span>
        <button id="increment">+</button>
    </div>

    <h2>2. Координаты мыши</h2>

    <div id="mouseBox">
        x: 0, y: 0
    </div>

    <div class="container">
        <h2>3. Изменение цвета фона</h2>

        <input
            type="text"
            id="colorInput"
            placeholder="Введите цвет"
        >
    </div>

    <script src="main.js"></script>
</body>
</html>
